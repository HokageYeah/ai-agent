[project]
name = "ai-agent"
version = "0.1.0"
description = ""
authors = [
    {name = "yuye",email = "659672626@qq.com"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.103.0",
    "uvicorn>=0.23.2",
    "sqlalchemy>=2.0.20",
    "alembic>=1.12.0",
    "mysql-connector-python>=8.1.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.3.0",
    "pydantic-settings>=2.0.3",
    "httpx>=0.25.0",
    "cachetools>=5.3.0",
    "loguru>=0.7.0",
    "colorama (>=0.4.6,<0.5.0)",
    # LLM Providers
    "openai>=1.12.0",
    "anthropic>=0.3.0",
    # LangGraph for Agent State Management
    "langgraph>=0.0.20",
    "jinja2 (>=3.1.6,<4.0.0)",
    "playwright (>=1.58.0,<2.0.0)",
]

[tool.poetry]
packages = [{include = "app"}]


[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^0.21.0"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.pytest_asyncio]
mode = "auto"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
